<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Todos Preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Day04</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a class="active" href="preview.html">Preview</a></li>
    </ul>
  </header>

  <main>
    <h1 class="page-title">Todos</h1>
    <p class="page-subtitle">Supabase의 test_todos 테이블 데이터를 불러옵니다.</p>

    <ul class="todo-list" id="todo-list"></ul>
  </main>

  <script>
    const SUPABASE_URL = "https://dooycrpyifzdqijrqbli.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_P2KRvv9Ygfz4ezTT_UsRnQ_xFWghWxH";

    async function loadTodos() {
      const listEl = document.getElementById("todo-list");
      try {
        const res = await fetch(`${SUPABASE_URL}test_todos?select=*&order=due_date.asc`, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!res.ok) {
          throw new Error(`요청 실패: ${res.status}`);
        }

        const todos = await res.json();

        if (todos.length === 0) {
          listEl.innerHTML = `<li class="state-message">데이터가 없습니다.</li>`;
          return;
        }

        listEl.innerHTML = todos
          .map((todo) => `
            <li class="todo-item ${todo.done ? "done" : ""}">
              <div>
                <div class="todo-title">${todo.title}</div>
                <div class="todo-meta">마감일 ${todo.due_date} · 소요 시간 ${todo.amount}</div>
              </div>
              <span class="todo-status ${todo.done ? "done" : "pending"}">
                ${todo.done ? "완료" : "진행중"}
              </span>
            </li>
          `)
          .join("");
      } catch (err) {
        listEl.innerHTML = `<li class="state-message">오류: ${err.message}</li>`;
      }
    }

    loadTodos();
  </script>
</body>
</html>
